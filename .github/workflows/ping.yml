name: Pipeline de Ping

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ping-github:
    name: Testar conectividade com GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Exibir informações
        run: |
          echo "Pipeline iniciada!"
          echo "Repositório: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Executar ping no GitHub
        run: |
          echo "Testando ping..."
          if ping -c 4 -W 5 github.com; then
            echo "Ping respondeu com sucesso!"
          else
            echo "::warning::Ping sem resposta. Pode haver bloqueio de ICMP."
          fi

      - name: Verificar conexão HTTPS
        run: |
          curl --fail --silent --show-error \
            --max-time 15 \
            https://github.com/ \
            -o /dev/null
          echo "Conexão HTTPS funcionando!"

      - name: Finalizar pipeline
        run: echo "Pipeline concluída com sucesso!"
